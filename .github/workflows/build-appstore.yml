name: Build AppStore

# Builds appstore.zip on every push to main and on PR (CI artifact only).
# Releases are now triggered EXPLICITLY by pushing semver tags (vX.Y.Z) —
# no more automatic timestamp tags on every commit, which made it
# impossible to pin a stable catalog version in roqueos-server consumers.
#
# How to release:
#   git tag -a v1.2.3 -m "Release v1.2.3"
#   git push origin v1.2.3

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'              # only semver tags trigger release
      - 'v[0-9]+.[0-9]+.[0-9]+-*'            # pre-releases (v1.0.0-beta.1)
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A validacao de schema existia desde sempre, em validate-schema.yml, e NAO estava no
  # caminho da entrega: o `release` dependia do `build`, e o `build` so zipava arquivos.
  # Uma tag vX.Y.Z publicava o appstore.zip sem que nada verificasse os manifestos, e o
  # parser do roqueos-server depende exatamente desse contrato. Ter o check e nao coloca-lo
  # entre o commit e o cliente e quase o mesmo que nao te-lo. (2026-08-17)
  validate:
    name: Manifestos batem com o schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validator deps
        run: npm install --no-save ajv@^8 ajv-formats@^3 js-yaml@^4
      - name: Validate every manifest against the schema
        run: node scripts/validate-manifests.mjs

  build:
    name: Build appstore.zip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create appstore.zip
        run: |
          zip -r appstore.zip Apps category-list.json recommend-list.json featured-apps.json -x "*.git*"
          ls -lh appstore.zip

      - name: Upload artifact (CI builds)
        uses: actions/upload-artifact@v4
        with:
          name: appstore
          path: appstore.zip
          retention-days: 30

  release:
    name: Publish release (only on vX.Y.Z tag)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create appstore.zip
        run: |
          zip -r appstore.zip Apps category-list.json recommend-list.json featured-apps.json -x "*.git*"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Determine if pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: appstore.zip
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          body: |
            ## RoqueOS Containers List ${{ steps.version.outputs.version }}

            Download `appstore.zip` and add the URL below to your RoqueOS / CasaOS dashboard:

            ```
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/appstore.zip
            ```

            For the always-latest release (rolling), use:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/appstore.zip
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for human-readable notes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
