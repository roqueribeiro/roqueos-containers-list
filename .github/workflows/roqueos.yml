# O gate da familia RoqueOS. Nao substitui o CI proprio deste repo: roda ao lado dele.
#
# O workflow reutilizavel detecta a tecnologia pelo conteudo do diretorio, roda o gate
# declarado em quality/<tech>.json, marca como PULADO o que este runner nao consegue rodar,
# e comenta o raio de impacto cross-repo nos PRs. Nove copias divergem em tres meses; uma
# chamada nao.
#
# Tres coisas aqui foram aprendidas em 2026-08-17, quando se descobriu que este arquivo
# NUNCA tinha criado um job:
#
#   - `@v2`, nao `@master`. Com `@master`, um push no harness reescrevia a esteira dos seis
#     repos no mesmo instante, sem ensaio e sem ninguem perceber. Mover a tag e o degrau de
#     intencao que faltava.
#   - `harness-token`. O harness e PRIVADO, e o GITHUB_TOKEN pertence a ESTE repo: ele nao
#     le repo privado alheio, e o checkout do harness volta 403. Precisa de um PAT no segredo.
#   - `branches:` no push. Sem o filtro, uma branch com PR aberto dispara push E
#     pull_request, e cada commit paga a esteira duas vezes.
name: roqueos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: roqueribeiro/roqueos-ecosystem/.github/workflows/roqueos-gate.yml@v2
    # A versao do node sai do .nvmrc deste repo. O `node-version:` que ficava aqui dizia
    # '22' enquanto os sete .nvmrc diziam 24: a esteira validava numa runtime que a familia
    # nao usa, que e o comeco exato de "passou no CI e quebrou na maquina".
    secrets:
      harness-token: ${{ secrets.HARNESS_TOKEN }}
