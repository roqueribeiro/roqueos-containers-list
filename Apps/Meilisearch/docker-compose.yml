name: meilisearch
services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
      - target: 7700
        published: '7700'
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /meili_data
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: 'true'
    x-casaos:
      ports:
        - container: '7700'
          description:
            en_us: HTTP API port
            pt_br: Porta da API HTTP
      volumes:
        - container: /meili_data
          description:
            en_us: Search index storage
            pt_br: Armazenamento dos índices de busca
      envs:
        - container: MEILI_MASTER_KEY
          description:
            en_us: "Master API key: generated by RoqueOS at install, unique to this server, shown once right after installing"
            pt_br: "Chave mestra da API: gerada pelo RoqueOS na instalação, única para este servidor, aparece uma vez logo depois de instalar"
    container_name: meilisearch
x-casaos:
  architectures:
    - amd64
    - arm64
  main: meilisearch
  author: RoqueOS Team
  category: Developer
  description:
    en_us: Meilisearch is a lightning-fast, hyper-relevant search engine you can run on your own infrastructure. Typo-tolerant, returns results in under 50ms, RESTful API, perfect drop-in replacement for Elasticsearch on small-to-medium datasets.
    pt_br: Meilisearch é um mecanismo de busca extremamente rápido e altamente relevante que você roda na sua própria infraestrutura. Tolerante a erros de digitação, retorna resultados em menos de 50ms, API RESTful, substituto natural do Elasticsearch para datasets pequenos e médios.
  developer: meilisearch
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Meilisearch/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Meilisearch/screenshot-1.png
  tagline:
    en_us: Lightning-fast, typo-tolerant search engine API
    pt_br: API de busca extremamente rápida e tolerante a erros de digitação
  thumbnail: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Meilisearch/thumbnail.png
  tips:
    before_install:
      en_us: |
        MEILI_MASTER_KEY is generated by RoqueOS at install, unique to this server, and shown once right after installing: save it, your clients need it to connect.
        After boot, hit GET /health on port 7700 to confirm. The web mini-dashboard is at GET /.
      pt_br: |
        MEILI_MASTER_KEY é gerada pelo RoqueOS na instalação, única para este servidor, e aparece uma vez logo depois de instalar: guarde-a, seus clientes precisam dela para conectar.
        Após o boot, faça GET /health na porta 7700 para confirmar. O mini-dashboard web está em GET /.
  title:
    en_us: Meilisearch
  index: /
  port_map: '7700'
  scheme: http
x-roqueos:
  gerar:
    MEILI_MASTER_KEY:
      formato: hex
      tamanho: 64
      mostrar: true
      descricao:
        en_us: Master key of the API
        pt_br: Chave mestra da API
