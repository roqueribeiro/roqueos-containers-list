name: podfetch
services:
  podfetch:
    image: samuel19982/podfetch:v5.2.3
    environment:
      DATABASE_URL: sqlite:///app/db/podcast.db
      POLLING_INTERVAL: "300"
      BASIC_AUTH: "false"
      GPODDER_INTEGRATION_ENABLED: "false"
    network_mode: bridge
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/podcasts
        target: /app/podcasts
      - type: bind
        source: /DATA/AppData/$AppID/db
        target: /app/db
    x-casaos:
      envs:
        - container: DATABASE_URL
          description:
            en_US: SQLite database location (or a PostgreSQL connection string)
            en_us: SQLite database location (or a PostgreSQL connection string)
        - container: POLLING_INTERVAL
          description:
            en_US: Minutes between checks for new episodes
            en_us: Minutes between checks for new episodes
        - container: BASIC_AUTH
          description:
            en_US: Set to true to enable login (required for GPodder sync); also set USERNAME and PASSWORD
            en_us: Set to true to enable login (required for GPodder sync); also set USERNAME and PASSWORD
        - container: GPODDER_INTEGRATION_ENABLED
          description:
            en_US: Set to true to enable the GPodder-compatible sync API for apps like AntennaPod
            en_us: Set to true to enable the GPodder-compatible sync API for apps like AntennaPod
      ports:
        - container: "8000"
          description:
            en_US: Web UI port
            en_us: Web UI port
      volumes:
        - container: /app/podcasts
          description:
            en_US: Downloaded podcast episodes
            en_us: Downloaded podcast episodes
        - container: /app/db
          description:
            en_US: SQLite database
            en_us: SQLite database
x-casaos:
  id: io.github.samtv12345.podfetch
  architectures:
    - amd64
    - arm64
  main: podfetch
  author: SamTV12345
  developer: SamTV12345
  category: Media
  description:
    en_US: |
      PodFetch is a sleek and efficient self-hosted podcast manager written in Rust. It automatically downloads new episodes of your favorite podcasts on a configurable interval and lets you listen to them from a clean, fast web UI on any device.

      Its standout feature is a GPodder-compatible sync API: keep using mobile podcast apps like AntennaPod while subscriptions, episode actions, and playback positions stay in sync with your server. PodFetch also supports multi-user setups with invites and roles, playlists, favorites, OPML import and export, podcast search via iTunes or Podcast Index, and optional OIDC or basic authentication.
    en_us: |
      PodFetch is a sleek and efficient self-hosted podcast manager written in Rust. It automatically downloads new episodes of your favorite podcasts on a configurable interval and lets you listen to them from a clean, fast web UI on any device.

      Its standout feature is a GPodder-compatible sync API: keep using mobile podcast apps like AntennaPod while subscriptions, episode actions, and playback positions stay in sync with your server. PodFetch also supports multi-user setups with invites and roles, playlists, favorites, OPML import and export, podcast search via iTunes or Podcast Index, and optional OIDC or basic authentication.
    pt_br: PodFetch é um gerenciador de podcast escrito em Rust para rodar no seu servidor. Baixa sozinho os episódios novos dos programas que você segue, no intervalo que você escolher.
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/PodFetch/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/PodFetch/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/PodFetch/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/PodFetch/screenshot-3.png
  tagline:
    en_US: Sleek podcast downloader with GPodder sync
    en_us: Sleek podcast downloader with GPodder sync
    pt_br: Gerenciador de podcast que baixa sozinho, com sincronia GPodder
  thumbnail: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/PodFetch/thumbnail.png
  tips: {}
  title:
    en_US: PodFetch
    en_us: PodFetch
  index: /
  port_map: "8000"
  scheme: http
  version: 5.2.3
  update_at: "2026-09-03"
  release_notes:
    en_US: |-
      - Adds Podcasting 2.0 transcript support and episode range downloads.
      - Improves aggregated RSS items with real links and source-podcast tags.
      - Fixes IME text input, English localization, and configured cover filenames during downloads and rescans.
    en_us: |-
      - Adds Podcasting 2.0 transcript support and episode range downloads.
      - Improves aggregated RSS items with real links and source-podcast tags.
      - Fixes IME text input, English localization, and configured cover filenames during downloads and rescans.
  website: https://samtv12345.github.io/PodFetch/
  repo: https://github.com/SamTV12345/PodFetch
  support: https://github.com/SamTV12345/PodFetch/issues
  docs: https://samtv12345.github.io/PodFetch/
x-roqueos:
  portaCompartilhada: true
