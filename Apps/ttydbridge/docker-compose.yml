name: ttydbridge
services:
  ttydbridge:
    x-casaos:
      ports:
        - container: "2222"
          description:
            en_us: Web interface for ttydBridge
    container_name: ttydbridge
    deploy:
      resources:
        reservations:
          memory: 8M
    environment:
      - EXEC_DIR=/opt
      - PORT=2222
      - START_COMMAND=login
    image: cp0204/ttydbridge:v0.0.3
    labels:
      icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ttydbridge/icon.png
    pid: host
    privileged: true
    restart: unless-stopped
    ports:
      - target: 2222
        published: "2222"
        protocol: tcp
    volumes:
      - type: bind
        source: /opt
        target: /opt
        bind:
          create_host_path: true
    network_mode: bridge
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  author: Cp0204
  category: Developer
  description:
    en_us: |
      ttydBridge acts as a "bridge" to the host environment, allowing you to easily access and use the host terminal in a web. It is built on ttyd and runs in a containerized manner, providing a secure and convenient remote endpoint experience.
    zh_cn: |
      ttydBridge 如一座“桥”，连通了宿主机环境，让你在浏览器中轻松访问和使用宿主机终端。它基于 ttyd 构建，并以容器化的方式运行，提供了安全、便捷的远程终端体验。
    pt_br: "ttydbridge expõe um shell do servidor dentro do navegador, pelo ttyd. É um acesso poderoso e deliberado: quem abre esta janela tem o mesmo alcance de quem está sentado na máquina, então mantenha fora da internet e atrás de autenticação."
  developer: Cp0204
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ttydbridge/icon.png
  index: /
  main: ttydbridge
  port_map: "2222"
  scheme: http
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ttydbridge/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ttydbridge/screenshot-2.png
  store_app_id: ttydbridge
  tagline:
    en_us: Easy access to the host terminal in web
    zh_cn: 在浏览器中轻松访问宿主机终端
    pt_br: Terminal do servidor, aberto no navegador
  tips:
    before_install:
      en_us: |
        1. Default to using Linux system user authentication.
        2. You can increase HTTP authentication by setting the `HTTP_USERNAME` and `HTTP_PASSWORD` variables.
        [Official DOC](https://hub.docker.com/r/cp0204/ttydbridge)
      zh_cn: |
        1. 默认使用 Linux 系统用户鉴权。

        2. 可以通过设置 `HTTP_USERNAME` `HTTP_PASSWORD` 变量，增加 HTTP 鉴权。

        [官方文档](https://hub.docker.com/r/cp0204/ttydbridge)
  title:
    en_us: ttydBridge
x-roqueos:
  portaCompartilhada: true
  motivo:
    privileged: expõe um shell do host, que é a função declarada do container
    volumeHost: monta /opt do host porque o shell exposto precisa enxergar o que está instalado lá
