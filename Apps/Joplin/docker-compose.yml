name: joplin
services:
  joplin:
    container_name: joplin
    image: joplin/server:3.7.1@sha256:0877bfba41a943017c42c58e90db9d8d548bfe699b5e410248b5b879371734f9
    restart: unless-stopped
    environment:
      - APP_PORT=22300
      - APP_BASE_URL=http://localhost:22300
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=27a1d42a-a15d-43dd-903c-2a73538647fe
      - POSTGRES_USER=bigbear
      - POSTGRES_DATABASE=joplin
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=joplin-db
      - MAX_TIME_DRIFT=0
    ports:
      - "22300:22300"
    networks:
      - big_bear_joplin_network
    depends_on:
      - joplin-db
    x-casaos:
      envs:
        - container: APP_PORT
          description:
            en_us: Port the app listens on inside the container
        - container: APP_BASE_URL
          description:
            en_us: Public address the app answers on
        - container: DB_CLIENT
          description:
            en_us: Database connection setting
        - container: POSTGRES_PASSWORD
          description:
            en_us: "Password: change it before the first boot"
        - container: POSTGRES_USER
          description:
            en_us: Database connection setting
        - container: POSTGRES_DATABASE
          description:
            en_us: Database connection setting
        - container: POSTGRES_PORT
          description:
            en_us: Database connection setting
        - container: POSTGRES_HOST
          description:
            en_us: Database connection setting
        - container: MAX_TIME_DRIFT
          description:
            en_us: Size or limit the app enforces
      ports:
        - container: "22300"
          description:
            en_us: Web interface for joplin
  joplin-db:
    container_name: joplin-db
    image: postgres:14.2@sha256:2c954f8c5d03da58f8b82645b783b56c1135df17e650b186b296fa1bb71f9cfd
    volumes:
      - /DATA/AppData/$AppID/postgresql/data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=27a1d42a-a15d-43dd-903c-2a73538647fe
      - POSTGRES_USER=bigbear
      - POSTGRES_DB=joplin
    networks:
      - big_bear_joplin_network
    x-casaos:
      envs:
        - container: POSTGRES_PASSWORD
          description:
            en_us: "Password: change it before the first boot"
        - container: POSTGRES_USER
          description:
            en_us: Database connection setting
        - container: POSTGRES_DB
          description:
            en_us: Database connection setting
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_us: "Application data: this is what you back up"
networks:
  big_bear_joplin_network:
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.joplin
  main: joplin
  description:
    en_US: Note taking and to-do application with synchronisation
    en_us: Note taking and to-do application with synchronisation
    pt_br: "Joplin é um aplicativo de notas e tarefas que sincroniza entre aparelhos. Este container é o servidor de sincronia: os clientes de desktop e celular conversam com ele."
  tagline:
    en_US: joplin
    en_us: joplin
    pt_br: Notas e tarefas com sincronia, e criptografia ponta a ponta
  developer: joplin
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/joplin.png
  thumbnail: ""
  tips:
    before_install:
      en_US: |
        Read this before installing: https://community.roqueribeiro.com/t/added-joplin-server-to-bigbearcasaos/800?u=dragonfire1119
      en_us: |
        Read this before installing: https://community.roqueribeiro.com/t/added-joplin-server-to-bigbearcasaos/800?u=dragonfire1119
  title:
    en_US: joplin
    en_us: joplin
  category: Productivity
  port_map: "22300"
  scheme: http
