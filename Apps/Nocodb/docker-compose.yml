name: nocodb
services:
  nocodb:
    image: nocodb/nocodb:0.301.5@sha256:d9516f0bf546fd6c78a382ab0657626c683fca7aaafdbbe53c66baf15df7fc0d
    container_name: nocodb
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://nocodb:nocodb@nocodb-db:5432/nocodb
      - NC_AUTH_JWT_SECRET=899499fc-36a0-4131-b077-7bb9f051ac9b
      - NC_REDIS_URL=redis://default:casaos@nocodb-redis:6379
    ports:
      - "8080:8080"
    volumes:
      - /DATA/AppData/$AppID/data:/usr/src/app/data
    networks:
      - nocodb-network
    x-casaos:
      envs:
        - container: DATABASE_URL
          description:
            en_US: "Container Variable: DATABASE_URL"
            en_us: "Container Variable: DATABASE_URL"
        - container: NC_AUTH_JWT_SECRET
          description:
            en_US: "Container Variable: NC_AUTH_JWT_SECRET"
            en_us: "Container Variable: NC_AUTH_JWT_SECRET"
        - container: NC_REDIS_URL
          description:
            en_US: "Container Variable: NC_REDIS_URL"
            en_us: "Container Variable: NC_REDIS_URL"
      volumes:
        - container: /usr/src/app/data
          description:
            en_US: "Container Path: /usr/src/app/data"
            en_us: "Container Path: /usr/src/app/data"
      ports:
        - container: "8080"
          description:
            en_US: "Container Port: 8080"
            en_us: "Container Port: 8080"
  nocodb-db:
    container_name: nocodb-db
    image: postgres:13@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    restart: always
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodb
    volumes:
      - /DATA/AppData/$AppID/pgdata:/var/lib/postgresql/data
    networks:
      - nocodb-network
    x-casaos:
      envs:
        - container: POSTGRES_DB
          description:
            en_US: "Container Variable: POSTGRES_DB"
            en_us: "Container Variable: POSTGRES_DB"
        - container: POSTGRES_USER
          description:
            en_US: "Container Variable: POSTGRES_USER"
            en_us: "Container Variable: POSTGRES_USER"
        - container: POSTGRES_PASSWORD
          description:
            en_US: "Container Variable: POSTGRES_PASSWORD"
            en_us: "Container Variable: POSTGRES_PASSWORD"
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_US: "Container Path: /var/lib/postgresql/data"
            en_us: "Container Path: /var/lib/postgresql/data"
  nocodb-redis:
    image: redis:8.2.2-alpine@sha256:1c78f5e7512cc8b22b0edc95c20e7abd9e1fd832e5dfd5c3c6b59ce82fb238d0
    container_name: nocodb-redis
    restart: unless-stopped
    command:
      - redis-server
      - "--requirepass"
      - casaos
    volumes:
      - /DATA/AppData/$AppID/redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - nocodb-network
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: "Container Path: /data"
            en_us: "Container Path: /data"
networks:
  nocodb-network:
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.nocodb
  main: nocodb
  description:
    en_US: NocoDB allows building no-code database solutions with ease of spreadsheets. Bring your own database or choose ours! Millions of rows? Not a problem. Your Data. Your rules. You are in control.
    en_us: NocoDB allows building no-code database solutions with ease of spreadsheets. Bring your own database or choose ours! Millions of rows? Not a problem. Your Data. Your rules. You are in control.
    pt_br: "NocoDB põe uma interface de planilha sobre um banco de dados de verdade: alternativa aberta ao Airtable, montando sistema sem escrever código e sem prender o dado num serviço."
  tagline:
    en_US: 🔥 🔥 🔥 Open Source Airtable Alternative
    en_us: 🔥 🔥 🔥 Open Source Airtable Alternative
    pt_br: Transforma seu banco numa planilha colaborativa
  developer: nocodb
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/nocodb.png
  thumbnail: https://user-images.githubusercontent.com/86527202/277104231-e2fad786-f211-4dcb-9bd3-aaece83a6783.gif
  title:
    en_US: NocoDB
    en_us: NocoDB
  category: Productivity
  port_map: "8080"
  scheme: http
x-roqueos:
  portaCompartilhada: true
