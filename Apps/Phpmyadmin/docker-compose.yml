name: phpmyadmin
services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    restart: unless-stopped
    container_name: phpmyadmin
    environment:
      PMA_HOST: "[YOUR-CASAOS-IP]"
      PMA_PORT: "3306"
      PMA_USER: bigbear
      PMA_PASSWORD: change-me-on-first-boot
    ports:
      - "8080:80"
    x-casaos:
      envs:
        - container: PMA_HOST
          description:
            en_us: Connection setting for a service this app depends on
        - container: PMA_PORT
          description:
            en_us: Port the app listens on inside the container
        - container: PMA_USER
          description:
            en_us: Account name the app uses
        - container: PMA_PASSWORD
          description:
            en_us: "Password: change it before the first boot"
      ports:
        - container: "80"
          description:
            en_us: Web interface for phpMyAdmin
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.phpmyadmin
  main: phpmyadmin
  description:
    en_US: phpMyAdmin - A web interface for MySQL and MariaDB.
    en_us: phpMyAdmin - A web interface for MySQL and MariaDB.
    pt_br: "phpMyAdmin é a interface web mais conhecida para administrar MySQL e MariaDB: roda consulta, edita tabela, importa e exporta dump."
  tagline:
    en_US: phpMyAdmin
    en_us: phpMyAdmin
    pt_br: A interface clássica de administração de MySQL e MariaDB
  developer: phpMyAdmin
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/phpmyadmin.png
  thumbnail: ""
  title:
    en_US: phpMyAdmin
    en_us: phpMyAdmin
  category: Developer
  port_map: "8080"
  scheme: http
x-roqueos:
  portaCompartilhada: true
