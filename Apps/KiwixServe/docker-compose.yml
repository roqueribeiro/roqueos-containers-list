name: kiwix-serve
services:
  kiwix-serve:
    container_name: kiwix-serve
    image: ghcr.io/kiwix/kiwix-serve:3.7.0-2@sha256:9a19c082d0cf4a2bebc190e62d9f76980f18ea35ca3c9347197c5ed0ebaa08ce
    command: "*.zim"
    restart: unless-stopped
    volumes:
      - /DATA/AppData/$AppID/zim:/data
    ports:
      - "8080:8080"
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: "Container Path: /data"
            en_us: "Container Path: /data"
      ports:
        - container: "8080"
          description:
            en_US: "Container Port: 8080"
            en_us: "Container Port: 8080"
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.kiwix-serve
  main: kiwix-serve
  description:
    en_US: Kiwix Server is a web server for hosting .zim files
    en_us: Kiwix Server is a web server for hosting .zim files
    pt_br: "Kiwix Server publica arquivos .zim na sua rede: Wikipédia, Stack Overflow, Project Gutenberg e outros acervos inteiros, para ler sem internet."
  tagline:
    en_US: Kiwix Server
    en_us: Kiwix Server
    pt_br: A Wikipédia inteira, offline, no seu servidor
  developer: kiwix
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/kiwix.png
  thumbnail: ""
  tips:
    before_install:
      en_US: |
        Read this before installing: https://community.roqueribeiro.com/t/added-kiwix-serve-to-bigbearcasaos/1554#documentation-4
      en_us: |
        Read this before installing: https://community.roqueribeiro.com/t/added-kiwix-serve-to-bigbearcasaos/1554#documentation-4
  title:
    en_US: Kiwix Server
    en_us: Kiwix Server
  category: Media
  port_map: "8080"
  scheme: http
x-roqueos:
  portaCompartilhada: true
