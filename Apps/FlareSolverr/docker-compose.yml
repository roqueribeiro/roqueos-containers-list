name: flaresolverr
services:
  flaresolverr:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
      UMASK: '002'
      LOG_LEVEL: info
      LOG_HTML: 'false'
      CAPTCHA_SOLVER: none
    cpu_shares: 50
    command: []
    container_name: flaresolverr
    deploy:
      resources:
        reservations:
          memory: 64M
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.5
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/FlareSolverr/icon.png
    ports:
      - target: 8191
        published: '8191'
        protocol: tcp
    restart: unless-stopped
    network_mode: bridge
    privileged: false
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  author: calganaygun
  category: Network
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/FlareSolverr/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/FlareSolverr/screenshot-1.png
  index: /
  port_map: '8191'
  scheme: http
  store_app_id: flaresolverr
  tagline:
    en_us: Proxy server to bypass Cloudflare protection
    pt_br: Proxy para contornar a proteção do Cloudflare
  description:
    en_us: FlareSolverr is a proxy server to bypass Cloudflare and DDoS-GUARD protection. It runs a headless browser to solve the challenges automatically and exposes a simple HTTP API used by *arr apps and scrapers.
    pt_br: FlareSolverr é um proxy que contorna automaticamente a proteção do Cloudflare e DDoS-GUARD. Roda um navegador headless para resolver os desafios e expõe uma API HTTP usada por apps *arr e scrapers.
  title:
    en_us: FlareSolverr
  main: flaresolverr
