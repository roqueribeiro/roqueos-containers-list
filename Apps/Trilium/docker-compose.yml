name: trilium
services:
  trilium:
    image: triliumnext/notes:0.91.6
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
      - target: 8080
        published: '8107'
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /home/node/trilium-data
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
      TZ: America/Sao_Paulo
    x-casaos:
      ports:
        - container: '8080'
          description:
            en_us: WebUI port (mapped to 8107 host)
            pt_br: Porta da interface web (mapeada para 8107 no host)
      volumes:
        - container: /home/node/trilium-data
          description:
            en_us: Notes database, attachments, backups
            pt_br: Banco de notas, anexos, backups
    container_name: trilium
x-casaos:
  architectures:
    - amd64
    - arm64
  main: trilium
  author: RoqueOS Team
  category: Notes
  description:
    en_us: Trilium Notes is a hierarchical note-taking application with infinite tree of notes, rich WYSIWYG editor, code notes with syntax highlighting, scripting (JavaScript/Python), embedded images/files, encryption per-note, full-text search, sync between server and desktop clients, relations and attributes for knowledge graphs. Now maintained as TriliumNext after the original was archived.
    pt_br: Trilium Notes é uma aplicação de notas hierárquica com árvore infinita de notas, editor WYSIWYG rico, code notes com syntax highlighting, scripting (JavaScript/Python), imagens/arquivos embutidos, criptografia por nota, busca full-text, sincronização entre servidor e clientes desktop, relations e atributos para grafos de conhecimento. Agora mantido como TriliumNext após o original ter sido arquivado.
  developer: TriliumNext
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Trilium/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Trilium/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Trilium/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Trilium/screenshot-3.png
  tagline:
    en_us: Hierarchical knowledge graph note-taking (TriliumNext fork)
    pt_br: Sistema de notas hierárquico com grafo de conhecimento (fork TriliumNext)
  thumbnail: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Trilium/thumbnail.png
  tips:
    before_install:
      en_us: |
        First boot at http://YOUR_IP:8107 prompts you to set the master password (used for encrypted notes).
        Desktop clients (electron build) sync with this server — install from https://github.com/TriliumNext/Notes/releases on Windows/macOS/Linux.
        Note: original `zadam/trilium` is archived. We use `triliumnext/notes` (active community fork) as the actively-maintained successor.
      pt_br: |
        O primeiro boot em http://SEU_IP:8107 pede para configurar a senha mestra (usada para notas criptografadas).
        Clientes desktop (builds electron) sincronizam com este servidor — instale de https://github.com/TriliumNext/Notes/releases no Windows/macOS/Linux.
        Obs: o original `zadam/trilium` está arquivado. Usamos `triliumnext/notes` (fork ativo da comunidade) como sucessor em desenvolvimento.
  title:
    en_us: Trilium Notes
  index: /
  port_map: '8107'
  scheme: http
