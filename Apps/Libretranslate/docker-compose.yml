name: libretranslate
services:
  libretranslate:
    container_name: libretranslate
    image: libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
    user: "0:0" # roda como root: o instalador cria o bind root:root e a imagem escreve como uid libretranslate
    restart: unless-stopped
    environment:
      - LT_API_KEYS=true
      - LT_API_KEYS_DB_PATH=/app/db/api_keys.db
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,fr,es,de,it,pt,ru,ja,zh
    volumes:
      - /DATA/AppData/$AppID/db:/app/db
      - /DATA/AppData/$AppID/.local:/home/libretranslate/.local
    ports:
      - "5000:5000"
    tty: true
    healthcheck:
      test:
        - CMD-SHELL
        - ./venv/bin/python scripts/healthcheck.py
    x-casaos:
      envs:
        - container: LT_API_KEYS
          description:
            en_us: "Secret: generate a long random value, never ship the default"
        - container: LT_API_KEYS_DB_PATH
          description:
            en_us: "Secret: generate a long random value, never ship the default"
        - container: LT_UPDATE_MODELS
          description:
            en_US: "Container Variable: LT_UPDATE_MODELS"
            en_us: "Container Variable: LT_UPDATE_MODELS"
        - container: LT_LOAD_ONLY
          description:
            en_US: "Container Variable: LT_LOAD_ONLY"
            en_us: "Container Variable: LT_LOAD_ONLY"
      volumes:
        - container: /app/db
          description:
            en_us: "Application data: this is what you back up"
        - container: /home/libretranslate/.local
          description:
            en_US: "Container Path: /home/libretranslate/.local"
            en_us: "Container Path: /home/libretranslate/.local"
      ports:
        - container: "5000"
          description:
            en_us: Web interface for LibreTranslate
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.libretranslate
  main: libretranslate
  description:
    en_US: Free and Open Source Machine Translation API, entirely self-hosted. Unlike other APIs, it doesn't rely on proprietary providers such as Google or Azure to perform translations. Instead, its translation engine is powered by the open source Argos Translate library.
    en_us: Free and Open Source Machine Translation API, entirely self-hosted. Unlike other APIs, it doesn't rely on proprietary providers such as Google or Azure to perform translations. Instead, its translation engine is powered by the open source Argos Translate library.
    pt_br: "LibreTranslate é uma API de tradução livre e inteiramente auto-hospedada. Diferente das outras, não depende de serviço de terceiro: o modelo roda no seu servidor e o texto não sai dele."
  tagline:
    en_US: Free and Open Source Machine Translation API. 100% self-hosted, offline capable and easy to setup.
    en_us: Free and Open Source Machine Translation API, entirely self-hosted
    pt_br: API de tradução automática que roda na sua máquina
  developer: LibreTranslate
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Libretranslate/icon.png
  thumbnail: ""
  title:
    en_US: LibreTranslate
    en_us: LibreTranslate
  category: AI
  port_map: "5000"
  scheme: http
x-roqueos:
  portaCompartilhada: true
