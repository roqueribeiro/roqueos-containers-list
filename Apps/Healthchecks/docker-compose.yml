name: healthchecks
services:
  healthchecks:
    container_name: healthchecks
    image: linuxserver/healthchecks:4.3.20260803@sha256:f8a148973d8b90587549674db70836f154eda474c0b87382b86064f2442c2f43
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - SITE_ROOT=http://localhost:8000
      - SITE_NAME="RoqueOS HealthChecks"
      - SUPERUSER_EMAIL=user@example.com
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - ALLOWED_HOSTS=*
      - APPRISE_ENABLED=False
      - DEBUG=False
      - SECRET_KEY="${SECRET_KEY}"
    volumes:
      - /DATA/AppData/$AppID/config:/config
    ports:
      - "8000:8000"
      - "2525:2525"
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: User ID that owns the files the app writes
        - container: PGID
          description:
            en_us: Group ID that owns the files the app writes
        - container: TZ
          description:
            en_us: Timezone, e.g. America/Sao_Paulo
        - container: SITE_ROOT
          description:
            en_US: Address Healthchecks uses in the links it sends (e-mail, badges)
            en_us: Address Healthchecks uses in the links it sends (e-mail, badges)
            pt_br: Endereço que o Healthchecks usa nos links que envia (e-mail, selos)
        - container: SITE_NAME
          description:
            en_us: Connection setting for a service this app depends on
        - container: SUPERUSER_EMAIL
          description:
            en_us: Outgoing e-mail setting
        - container: SUPERUSER_PASSWORD
          description:
            en_us: "Admin password: generated by RoqueOS at install, unique to this server, shown once right after installing"
            pt_br: "Senha do admin: gerada pelo RoqueOS na instalação, única para este servidor, aparece uma vez logo depois de instalar"
        - container: ALLOWED_HOSTS
          description:
            en_us: Feature switch
        - container: APPRISE_ENABLED
          description:
            en_us: Feature switch
        - container: DEBUG
          description:
            en_US: "Container Variable: DEBUG"
            en_us: "Container Variable: DEBUG"
        - container: SECRET_KEY
          description:
            en_us: "Secret: generated by RoqueOS at install, unique to this server"
            pt_br: "Segredo: gerado pelo RoqueOS na instalação, único para este servidor"
      volumes:
        - container: /config
          description:
            en_us: Configuration files, kept between updates
      ports:
        - container: "8000"
          description:
            en_us: Web interface for Healthchecks
        - container: "2525"
          description:
            en_us: "SMTP listener: lets a cron job ping by sending an e-mail"
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.healthchecks
  main: healthchecks
  description:
    en_US: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
    en_us: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
    pt_br: Healthchecks espera um ping de cada tarefa agendada. Se o ping não chega na hora, você é avisado. É o jeito de descobrir que o backup parou antes de precisar dele.
  tagline:
    en_US: Healthchecks
    en_us: Healthchecks
    pt_br: "Vigia dos seus cron: avisa quando um deixa de rodar"
  developer: linuxserver
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/healthchecks.png
  thumbnail: ""
  title:
    en_US: Healthchecks
    en_us: Healthchecks
  category: Utilities
  port_map: "8000"
  tips:
    before_install:
      en_us: |
        SUPERUSER_PASSWORD (the admin login) and SECRET_KEY are generated by RoqueOS at install, unique to this server. The admin password is shown once right after installing: save it.
        The admin user is the SUPERUSER_EMAIL address. SITE_ROOT is the address used in the links Healthchecks sends; set it to your server address if you use e-mail alerts.
      pt_br: |
        SUPERUSER_PASSWORD (a senha do admin) e SECRET_KEY são gerados pelo RoqueOS na instalação, únicos para este servidor. A senha do admin aparece uma vez logo depois de instalar: guarde-a.
        O usuário admin é o e-mail de SUPERUSER_EMAIL. SITE_ROOT é o endereço usado nos links que o Healthchecks envia; ponha o endereço do seu servidor se usar alerta por e-mail.
  scheme: http
x-roqueos:
  gerar:
    SUPERUSER_PASSWORD:
      formato: senha
      tamanho: 24
      mostrar: true
    SECRET_KEY:
      formato: hex
      tamanho: 64
  portaCompartilhada: true
