name: healthchecks
services:
  healthchecks:
    container_name: healthchecks
    image: linuxserver/healthchecks:4.3.20260803@sha256:f8a148973d8b90587549674db70836f154eda474c0b87382b86064f2442c2f43
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SITE_ROOT=http://[YOUR_CASAOS_IP]
      - SITE_NAME="RoqueOS HealthChecks"
      - SUPERUSER_EMAIL=user@example.com
      - SUPERUSER_PASSWORD=8a4c087a-2652-4d12-a6cc-feeb60e59dd4
      - ALLOWED_HOSTS=
      - APPRISE_ENABLED=False
      - CSRF_TRUSTED_ORIGINS=
      - DEBUG=True
      - DEFAULT_FROM_EMAIL=
      - EMAIL_HOST=
      - EMAIL_PORT=
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - EMAIL_USE_TLS=
      - INTEGRATIONS_ALLOW_PRIVATE_IPS=
      - PING_EMAIL_DOMAIN=
      - RP_ID=
      - SECRET_KEY="b2ea4094-c950-4890-b85f-301d8a777af2"
      - SITE_LOGO_URL=
    volumes:
      - /DATA/AppData/$AppID/config:/config
    ports:
      - "8000:8000"
      - "2525:2525"
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: User ID that owns the files the app writes
        - container: PGID
          description:
            en_us: Group ID that owns the files the app writes
        - container: TZ
          description:
            en_us: Timezone, e.g. America/Sao_Paulo
        - container: SITE_ROOT
          description:
            en_US: "Container Variable: SITE_ROOT"
            en_us: "Container Variable: SITE_ROOT"
        - container: SITE_NAME
          description:
            en_us: Connection setting for a service this app depends on
        - container: SUPERUSER_EMAIL
          description:
            en_us: Outgoing e-mail setting
        - container: SUPERUSER_PASSWORD
          description:
            en_us: "Password: change it before the first boot"
        - container: ALLOWED_HOSTS
          description:
            en_us: Feature switch
        - container: APPRISE_ENABLED
          description:
            en_us: Feature switch
        - container: CSRF_TRUSTED_ORIGINS
          description:
            en_US: "Container Variable: CSRF_TRUSTED_ORIGINS"
            en_us: "Container Variable: CSRF_TRUSTED_ORIGINS"
        - container: DEBUG
          description:
            en_US: "Container Variable: DEBUG"
            en_us: "Container Variable: DEBUG"
        - container: DEFAULT_FROM_EMAIL
          description:
            en_us: Outgoing e-mail setting
        - container: EMAIL_HOST
          description:
            en_us: Outgoing e-mail setting
        - container: EMAIL_PORT
          description:
            en_us: Outgoing e-mail setting
        - container: EMAIL_HOST_USER
          description:
            en_us: Outgoing e-mail setting
        - container: EMAIL_HOST_PASSWORD
          description:
            en_us: "Password: change it before the first boot"
        - container: EMAIL_USE_TLS
          description:
            en_us: Outgoing e-mail setting
        - container: INTEGRATIONS_ALLOW_PRIVATE_IPS
          description:
            en_US: "Container Variable: INTEGRATIONS_ALLOW_PRIVATE_IPS"
            en_us: "Container Variable: INTEGRATIONS_ALLOW_PRIVATE_IPS"
        - container: PING_EMAIL_DOMAIN
          description:
            en_us: Outgoing e-mail setting
        - container: RP_ID
          description:
            en_US: "Container Variable: RP_ID"
            en_us: "Container Variable: RP_ID"
        - container: SECRET_KEY
          description:
            en_us: "Secret: generate a long random value, never ship the default"
        - container: SITE_LOGO_URL
          description:
            en_us: Public address the app answers on
      volumes:
        - container: /config
          description:
            en_us: Configuration files, kept between updates
      ports:
        - container: "8000"
          description:
            en_us: Web interface for Healthchecks
        - container: "2525"
          description:
            en_us: "SMTP listener: lets a cron job ping by sending an e-mail"
x-casaos:
  architectures:
    - amd64
    - arm64
  id: br.com.roqueos.healthchecks
  main: healthchecks
  description:
    en_US: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
    en_us: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
    pt_br: Healthchecks espera um ping de cada tarefa agendada. Se o ping não chega na hora, você é avisado. É o jeito de descobrir que o backup parou antes de precisar dele.
  tagline:
    en_US: Healthchecks
    en_us: Healthchecks
    pt_br: "Vigia dos seus cron: avisa quando um deixa de rodar"
  developer: linuxserver
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/healthchecks.png
  thumbnail: ""
  title:
    en_US: Healthchecks
    en_us: Healthchecks
  category: Utilities
  port_map: "8000"
  scheme: http
x-roqueos:
  portaCompartilhada: true
