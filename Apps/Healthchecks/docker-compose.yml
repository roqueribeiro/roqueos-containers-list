  description:
    en_US: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
    en_us: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
    pt_br: Healthchecks espera um ping de cada tarefa agendada. Se o ping não chega na hora, você é avisado. É o jeito de descobrir que o backup parou antes de precisar dele.
