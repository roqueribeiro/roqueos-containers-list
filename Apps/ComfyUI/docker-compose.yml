name: comfyui
services:
  comfyui:
    # A imagem cu126 exige placa NVIDIA e reiniciava sem parar em servidor sem
    # GPU (boot do CI em 15/11/2026). A variante cpu sobe em qualquer servidor
    # amd64; quem tem placa troca a imagem pela cu126 depois.
    image: yanwk/comfyui-boot:cpu-20261116
    deploy:
      resources:
        reservations:
          memory: 4096M
    network_mode: bridge
    ports:
      - target: 8188
        published: '8188'
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/storage
        target: /root
    environment:
      CLI_ARGS: '--listen 0.0.0.0 --port 8188 --cpu'
    x-casaos:
      ports:
        - container: '8188'
          description:
            en_us: WebUI port (node-graph editor)
            pt_br: Porta da interface web (editor de grafos)
      volumes:
        - container: /root
          description:
            en_us: Models, custom nodes, workflows, output images
            pt_br: Modelos, nodes customizados, workflows, imagens de saída
    container_name: comfyui
x-casaos:
  architectures:
    - amd64
  main: comfyui
  author: RoqueOS Team
  category: AI
  description:
    en_us: 'ComfyUI is the most powerful and modular Stable Diffusion GUI — a node-based interface that exposes the entire diffusion pipeline graph. Visual programming for image generation, perfect for advanced users who want full control of SDXL, SD3, Flux, ControlNet, LoRA, IP-Adapter, AnimateDiff, video generation. The default engine for many AI artists.'
    pt_br: 'ComfyUI é a GUI mais poderosa e modular para Stable Diffusion — uma interface baseada em nodes que expõe o pipeline inteiro de difusão como grafo. Programação visual para geração de imagens, perfeito para usuários avançados que querem controle completo de SDXL, SD3, Flux, ControlNet, LoRA, IP-Adapter, AnimateDiff, geração de vídeo. Engine default de muitos artistas IA.'
  developer: comfyanonymous
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ComfyUI/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ComfyUI/screenshot-1.png
  tagline:
    en_us: Node-based Stable Diffusion GUI for power users
    pt_br: GUI baseada em nodes para Stable Diffusion (usuários avançados)
  thumbnail: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/ComfyUI/thumbnail.png
  tips:
    before_install:
      en_us: |
        This version runs on the CPU, so it installs on any amd64 server. Image generation on the CPU is slow: minutes per image.
        With an NVIDIA card and the NVIDIA Container Toolkit on the server, switch the image to yanwk/comfyui-boot:cu126-megapak and give the container the GPU.
        First use downloads the base models (several GB). ComfyUI Manager comes in the image, so custom nodes install from the UI.
      pt_br: |
        Esta versão roda na CPU, então instala em qualquer servidor amd64. Gerar imagem na CPU é lento: minutos por imagem.
        Com placa NVIDIA e o NVIDIA Container Toolkit no servidor, troque a imagem por yanwk/comfyui-boot:cu126-megapak e entregue a GPU ao container.
        O primeiro uso baixa os modelos base (vários GB). O ComfyUI Manager vem na imagem, então nós customizados instalam pela interface.
  title:
    en_us: ComfyUI
  index: /
  port_map: '8188'
  scheme: http
